<!DOCTYPE html>
<html lang="en">
<head>
	<title>Super Duper Form</title>
	<meta charset="utf-8">
	<script src="popup.js"></script>
</head>

<body>

<form>

	Firstname : <input type="text" id="firstname" name="firstname" required><br>
	Name : <input type="text" id="name" name="name" required><br>
	Age : <input type="number" id="age" name="age" required><br>
	Phone : <input type="tel" id="phone" name="Phone" placeholder="00 00 00 00 00" pattern="[0-9]{2} [0-9]{2} [0-9]{2} [0-9]{2} [0-9]{2}" required><br>
	Email : <input type="email" id="email" name="Email" required><br>
	Student at 42 ? : <input type="checkbox" id="student" name="student" required><br>
	Male <input type="radio" id="gender_male" name="gender" value="Male" required>
	Female <input type="radio" id="gender_female" name="gender" value="Female">
	Other <input type="radio" id="gender_other" name="gender" value="Other"><br>
	<input type="submit" value="Run that sexy Javascript !" onclick="displayFormContents();" />
</form>

</body>
</html>
